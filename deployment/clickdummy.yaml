# Clickdummy — the mock-mode marketplace UI at clickdummy.<cluster domain>.
#
# Deliberately NOT wired through the CIVITAS add-on mechanism: in mock mode the
# app is fully self-contained (no Keycloak — page-shell.tsx skips the sign-in
# wall when isMockMode(), no portal-backend — everything runs on fixtures and
# an in-memory install store). A plain Deployment + Service + Ingress is the
# honest shape for that. It is also not a static site: server actions and the
# role cookie need the Node server, which is why this is a container and not a
# file drop.
#
# Prerequisites already in place on the cluster:
#   - wildcard DNS for the cluster domain → ingress LB (Cloudflare, DNS only)
#   - nginx ingress class + cert-manager cluster issuer 'letsencrypt'
#     (same pair the platform's own APISIX ingress uses)
#
# The address is per cluster, so the Ingress lives in its own file:
# Deploy (demo): kubectl apply -f deployment/clickdummy.yaml -f deployment/clickdummy-ingress-demo.yaml
# Deploy (dev):  kubectl apply -f deployment/clickdummy.yaml -f deployment/clickdummy-ingress-dev.yaml
# Image:   docker buildx build --platform linux/amd64 \
#            -t ghcr.io/open-urban-apps-civitascore/clickdummy:v0.7.0 \
#            app --push
#          (MARKETPLACE_MOCK=1 is baked into the image — see app/Dockerfile.)
---
apiVersion: v1
kind: Namespace
metadata:
  name: clickdummy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickdummy
  namespace: clickdummy
  labels:
    app.kubernetes.io/name: clickdummy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickdummy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickdummy
    spec:
      securityContext:
        runAsNonRoot: true
        # The image's nextjs user (uid 1001), see app/Dockerfile.
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: app
          # Bump on every rebuild: with an unchanged tag `kubectl apply` reports
          # "unchanged" and rolls out nothing, so the cluster keeps serving the
          # old code while the registry already holds the new image.
          image: ghcr.io/open-urban-apps-civitascore/clickdummy:v0.7.0
          ports:
            - name: http
              containerPort: 3001
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: clickdummy
  namespace: clickdummy
spec:
  selector:
    app.kubernetes.io/name: clickdummy
  ports:
    - name: http
      port: 80
      # The addon app listens on 3001 (the real marketplace uses 3000) — the
      # mismatch that would otherwise surface as a 502.
      targetPort: 3001
